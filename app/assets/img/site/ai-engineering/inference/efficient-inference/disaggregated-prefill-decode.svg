<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-labelledby="title"><title id="title">Separate pools for prefill and decode</title><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker markerUnits="userSpaceOnUse" id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1000" height="655" rx="0" fill="#141a17"/><text x="32" y="45" class="title">Separate pools for prefill and decode</text><rect x="32" y="105" width="936" height="90" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="139" class="heading">Incoming prompt</text><text x="52" y="170" class="body">Prompt tokens and request state</text><path d="M250,208 L250,248" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="408" height="165" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="52" y="299" class="heading">Prefill pool</text><text x="52" y="330" class="body">Process the prompt in parallel</text><text x="52" y="357" class="body">Build per-request key-value state</text><rect x="560" y="265" width="408" height="165" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="580" y="299" class="heading">Decode pool</text><text x="580" y="330" class="body">Reuse transferred state</text><text x="580" y="357" class="body">Generate successive tokens</text><path d="M452,350 L547,350" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="454" y="325" class="small">KV state</text><path d="M764,443 L764,485" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="560" y="500" width="408" height="78" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="580" y="534" class="heading">Generated tokens</text><text x="32" y="620" class="note">The transfer has latency and bandwidth costs. Size and placement affect whether separation helps.</text></svg>
