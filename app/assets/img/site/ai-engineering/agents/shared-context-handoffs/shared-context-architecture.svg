th d="M560,426 L560,459" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="32" y="478" width="1056" height="217" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="512" class="heading">Shared context and artifact stores</text><rect x="52" y="535" width="497" height="58" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="569" class="heading">Durable checkpoints</text><rect x="568" y="535" width="497" height="58" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="588" y="569" class="heading">Structured task state</text><rect x="52" y="610" width="497" height="58" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="644" class="heading">Evidence references + provenance</text><rect x="568" y="610" width="497" height="58" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="588" y="644" class="heading">Memory + scoped policy records</text><path d="M560,710 L560,742" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="32" y="760" width="1056" height="64" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="794" class="heading">Document storage · vector indexes · databases · external tools</text><text x="32" y="864" class="note">Agents exchange permitted references. Backend services enforce permissions on every tool call.</text></svg>
