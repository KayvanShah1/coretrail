<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1010" viewBox="0 0 1080 1010" role="img" aria-labelledby="title"><title id="title">How scans become joins and grouped results</title><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker markerUnits="userSpaceOnUse" id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1080" height="1010" rx="0" fill="#141a17"/><text x="32" y="45" class="title">How scans become joins and grouped results</text><text x="32" y="85" class="note">Illustrative distributed plan: actual stages and join strategy depend on the optimizer.</text><rect x="32" y="125" width="440" height="155" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="159" class="heading">Scan orders</text><text x="52" y="190" class="body">Read required columns</text><text x="52" y="217" class="body">Apply an eligible date predicate</text><text x="52" y="244" class="body">Project merchant_id and amount</text><rect x="608" y="125" width="440" height="155" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="628" y="159" class="heading">Scan merchant dimension</text><text x="628" y="190" class="body">Read merchant_id and region</text><text x="628" y="217" class="body">Apply dimension predicates</text><text x="628" y="244" class="body">Check merchant-key uniqueness</text><path d="M252,292 V318 H425 V347" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M828,292 V318 H655 V347" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="360" width="580" height="104" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="270" y="394" class="heading">Join on merchant_id</text><text x="270" y="425" class="body">Redistribute matching keys when required</text><path d="M540,476 L540,511" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="525" width="580" height="94" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="270" y="559" class="heading">Partial aggregation</text><text x="270" y="590" class="body">Workers combine local amounts by region</text><path d="M540,632 L540,667" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="680" width="580" height="94" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="270" y="714" class="heading">Exchange by region</text><text x="270" y="745" class="body">Bring matching region groups together</text><path d="M540,786 L540,821" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="250" y="835" width="580" height="94" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="270" y="869" class="heading">Final aggregation</text><text x="270" y="900" class="body">Merge partial sums into one result per region</text><text x="32" y="977" class="note">A small dimension can be broadcast instead; confirm the executed plan and runtime row counts.</text></svg>
