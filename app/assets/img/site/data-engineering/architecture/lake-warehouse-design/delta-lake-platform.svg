<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title"><title id="title">A lake platform with explicit publication and serving</title><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker markerUnits="userSpaceOnUse" id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1100" height="960" rx="0" fill="#141a17"/><text x="32" y="45" class="title">A lake platform with explicit publication and serving</text><rect x="32" y="85" width="470" height="110" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="119" class="heading">Source capture + retained raw objects</text><text x="52" y="150" class="body">Business key, event time, source revision</text><text x="52" y="177" class="body">Capture offset and arrival time</text><rect x="576" y="85" width="492" height="110" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="596" y="119" class="heading">Catalog + identity + access controls</text><text x="596" y="150" class="body">Resolve table names and permitted operations</text><text x="596" y="177" class="body">Lineage and ownership apply across the platform</text><path d="M267,205 L267,245" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="265" width="1036" height="255" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="52" y="299" class="heading">Delta table on object storage</text><rect x="52" y="325" width="445" height="158" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="359" class="heading">Data files</text><text x="72" y="390" class="body">Parquet files in table storage</text><text x="72" y="417" class="body">Writers prepare new files</text><text x="72" y="444" class="body">Files alone do not publish a snapshot</text><rect x="534" y="325" width="511" height="158" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="554" y="359" class="heading">Transaction log: _delta_log/</text><text x="554" y="390" class="body">Schema, protocol and committed file actions</text><text x="554" y="417" class="body">Readers reconstruct a coherent table snapshot</text><text x="554" y="444" class="body">Retention must preserve required data files</text><path d="M509,405 L522,405" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M822,207 L822,252" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M550,530 L550,570" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="590" width="1036" height="105" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="624" class="heading">Validated compute + controlled publication</text><text x="52" y="655" class="body">Typed transformations, history and reconciliation</text><text x="52" y="682" class="body">Coordinate several table outputs when consumers require a consistent release</text><path d="M290,706 L290,745" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M810,706 L810,745" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="765" width="500" height="114" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="799" class="heading">Query the lakehouse</text><text x="52" y="830" class="body">SQL, reports and training read table snapshots</text><text x="52" y="857" class="body">Measure latency, concurrency and scan cost</text><rect x="568" y="765" width="500" height="114" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="588" y="799" class="heading">Optional warehouse / serving copy</text><text x="588" y="830" class="body">Add for measured serving requirements</text><text x="588" y="857" class="body">Track freshness, versions and corrections</text><text x="32" y="924" class="note">Catalog lookup and log commits have different responsibilities; confirm guarantees for each engine.</text></svg>
