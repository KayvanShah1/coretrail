<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="745" viewBox="0 0 1100 745" role="img" aria-labelledby="title"><title id="title">Medallion: data models and quality responsibilities</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1100" height="745" rx="16" fill="#141a17"/><text x="32" y="45" class="title">Medallion: data models and quality responsibilities</text><text x="32" y="85" class="note">Quality stages describe data responsibilities; batch and streaming can populate each stage.</text><rect x="32" y="125" width="312" height="360" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="52" y="159" class="heading">Bronze: retained input</text><text x="52" y="190" class="body">Source-shaped records</text><text x="52" y="217" class="body">Capture time + source revision</text><text x="52" y="244" class="body">Original identifiers</text><text x="52" y="271" class="body">Replayable source evidence</text><rect x="394" y="125" width="312" height="360" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="414" y="159" class="heading">Silver: validated entities</text><text x="414" y="190" class="body">Typed fields + contracts</text><text x="414" y="217" class="body">Deduplication + identity</text><text x="414" y="244" class="body">Effective-time history</text><text x="414" y="271" class="body">Rejected records tracked</text><rect x="756" y="125" width="312" height="360" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="776" y="159" class="heading">Gold: consumer models</text><text x="776" y="190" class="body">Facts + dimensions</text><text x="776" y="217" class="body">Declared metric definitions</text><text x="776" y="244" class="body">Feature and serving tables</text><text x="776" y="271" class="body">Freshness + reconciliation</text><path d="M351,285 L382,285" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M714,285 L746,285" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="414" y="540" width="272" height="92" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="434" y="574" class="heading">Quarantine / repair</text><text x="434" y="605" class="body">Reason, source ID, revision</text><path d="M550,497 L550,529" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="570" y="520" class="small">invalid</text><path d="M414,585 H365 V410 H384" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="675" class="body">Repair creates a traceable reprocessing path. Retention and publication rules apply to every stage.</text><text x="32" y="711" class="note">A silver model can use normalized entities or Data Vault; a gold model can use stars or wide marts.</text></svg>
