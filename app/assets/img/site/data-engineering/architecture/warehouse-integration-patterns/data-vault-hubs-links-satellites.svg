<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="735" viewBox="0 0 1100 735" role="img" aria-labelledby="title"><title id="title">Data Vault: identity, relationships and history</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1100" height="735" rx="16" fill="#141a17"/><text x="32" y="45" class="title">Data Vault: identity, relationships and history</text><text x="32" y="85" class="note">BK = business key · HK = hash key · shown keys are simplified</text><rect x="32" y="125" width="310" height="173" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="52" y="159" class="heading">HUB_CUSTOMER</text><text x="52" y="190" class="body">customer_hk  PK</text><text x="52" y="217" class="body">customer_bk</text><text x="52" y="244" class="body">loaded_at</text><text x="52" y="271" class="body">record_source</text><rect x="758" y="125" width="310" height="173" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="778" y="159" class="heading">HUB_ORDER</text><text x="778" y="190" class="body">order_hk  PK</text><text x="778" y="217" class="body">order_bk</text><text x="778" y="244" class="body">loaded_at</text><text x="778" y="271" class="body">record_source</text><rect x="395" y="125" width="310" height="200" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="415" y="159" class="heading">LINK_CUSTOMER_ORDER</text><text x="415" y="190" class="body">link_hk  PK</text><text x="415" y="217" class="body">customer_hk  FK</text><text x="415" y="244" class="body">order_hk  FK</text><text x="415" y="271" class="body">loaded_at</text><text x="415" y="298" class="body">record_source</text><path d="M352,215 L382,215" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M747,215 L718,215" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M187,310 L187,385" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M913,310 L913,385" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="402" width="422" height="173" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="52" y="436" class="heading">SAT_CUSTOMER</text><text x="52" y="467" class="body">customer_hk + loaded_at  PK</text><text x="52" y="494" class="body">region, name</text><text x="52" y="521" class="body">hash_diff</text><text x="52" y="548" class="body">record_source</text><rect x="646" y="402" width="422" height="173" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="666" y="436" class="heading">SAT_ORDER</text><text x="666" y="467" class="body">order_hk + loaded_at  PK</text><text x="666" y="494" class="body">status, amount</text><text x="666" y="521" class="body">hash_diff</text><text x="666" y="548" class="body">record_source</text><text x="32" y="665" class="body">Hubs identify business keys. Links record associations. Satellites retain descriptive versions.</text><text x="32" y="701" class="note">Load time records arrival. Business effective time needs its own attributes and rules.</text></svg>
