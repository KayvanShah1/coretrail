<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="770" viewBox="0 0 1060 770" role="img" aria-labelledby="title"><title id="title">Two places to integrate shared business meaning</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1060" height="770" rx="16" fill="#141a17"/><text x="32" y="45" class="title">Two places to integrate shared business meaning</text><rect x="32" y="80" width="482" height="618" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="114" class="heading">Kimball: integrate business processes</text><rect x="546" y="80" width="482" height="618" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="566" y="114" class="heading">Inmon: integrate enterprise entities</text><rect x="52" y="145" width="442" height="76" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="179" class="heading">Source systems</text><text x="72" y="210" class="body">Orders, returns and customer records</text><path d="M273,230 L273,263" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="280" width="442" height="106" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="72" y="314" class="heading">Dimensional delivery</text><text x="72" y="345" class="body">Sales fact       Returns fact</text><text x="72" y="372" class="body">Each fact retains its own grain</text><rect x="52" y="419" width="442" height="92" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="453" class="heading">Conformed dimensions</text><text x="72" y="484" class="body">Shared customer, product and date</text><path d="M273,408 L273,392" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M273,520 L273,550" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="570" width="442" height="88" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="604" class="heading">Cross-process reporting</text><text x="72" y="635" class="body">Aggregate each fact, then combine</text><rect x="566" y="145" width="442" height="76" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="586" y="179" class="heading">Source systems</text><text x="586" y="210" class="body">Operational schemas and identifiers</text><path d="M787,230 L787,263" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="566" y="280" width="442" height="126" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="586" y="314" class="heading">Integrated enterprise warehouse</text><text x="586" y="345" class="body">Normalized entities and relationships</text><text x="586" y="372" class="body">Reconciled identity and history</text><text x="586" y="399" class="body">Shared enterprise definitions</text><path d="M787,417 L787,452" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="566" y="470" width="442" height="88" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="586" y="504" class="heading">Consumer marts</text><text x="586" y="535" class="body">Finance star       Operations star</text><path d="M787,570 L787,600" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="589" y="638" class="body">Presentation follows enterprise integration</text><text x="32" y="740" class="note">Both need governed definitions. Storage technology does not determine the modelling method.</text></svg>
