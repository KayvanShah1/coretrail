<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="795" viewBox="0 0 1060 795" role="img" aria-labelledby="title"><title id="title">Kimball and Inmon: where integration happens</title><defs><marker markerUnits="userSpaceOnUse" id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#92d4b0"/></marker><marker markerUnits="userSpaceOnUse" id="back" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="#92d4b0"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7f5}.title{font-size:28px;font-weight:700}.heading{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:17px;fill:#bccfc3}.small{font-size:16px;fill:#bccfc3}</style><rect width="1060" height="795" rx="0" fill="#141a17"/><text x="32" y="45" class="title">Kimball and Inmon: where integration happens</text><rect x="32" y="85" width="482" height="640" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="52" y="119" class="heading">Kimball bus architecture</text><text x="52" y="150" class="body">Conformed facts and dimensions</text><rect x="546" y="85" width="482" height="640" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="566" y="119" class="heading">Inmon-style enterprise warehouse</text><text x="566" y="150" class="body">Integration before consumer marts</text><rect x="52" y="182" width="442" height="96" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="216" class="heading">Source systems</text><text x="72" y="247" class="body">Orders, returns and customer records</text><rect x="566" y="182" width="442" height="96" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="586" y="216" class="heading">Source systems</text><text x="586" y="247" class="body">Operational schemas and identifiers</text><path d="M273,291 L273,322" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M787,291 L787,322" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="335" width="442" height="151" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="72" y="369" class="heading">Dimensional integration</text><text x="72" y="400" class="body">Conformed customer, product and date</text><text x="72" y="427" class="body">Sales and returns retain their own grain</text><text x="72" y="454" class="body">Shared keys, attributes and history</text><rect x="566" y="335" width="442" height="151" rx="12" fill="#20372d" stroke="#92d4b0" stroke-width="1.5"/><text x="586" y="369" class="heading">Enterprise integration</text><text x="586" y="400" class="body">Normalized entities and relationships</text><text x="586" y="427" class="body">Reconciled business identity and history</text><text x="586" y="454" class="body">Common enterprise definitions</text><path d="M273,499 L273,532" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M787,499 L787,532" fill="none" stroke="#92d4b0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="52" y="546" width="442" height="116" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="72" y="580" class="heading">Cross-process reporting</text><text x="72" y="611" class="body">Aggregate each process to common keys</text><text x="72" y="638" class="body">Combine the resulting measures</text><rect x="566" y="546" width="442" height="116" rx="12" fill="#202624" stroke="#4c5c54" stroke-width="1.5"/><text x="586" y="580" class="heading">Consumer marts</text><text x="586" y="611" class="body">Finance star and operations mart</text><text x="586" y="638" class="body">Reshape shared enterprise history</text><text x="32" y="763" class="note">Both need governed definitions. Storage technology does not determine the modelling method.</text></svg>
