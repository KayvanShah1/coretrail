title: CoreTrail
description: Free technical interview revision notes for data, AI, and software engineers, with worked SQL examples, query performance, LLM serving, and infrastructure trade-offs.
url: https://kayvanshah1.github.io
baseurl: /coretrail
repository: KayvanShah1/coretrail
source: app
destination: _site
collections_dir: subjects/collections
layouts_dir: templates/layouts
includes_dir: templates/includes
markdown: kramdown
highlighter: rouge
sass:
  style: compressed
  sourcemap: never
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  sql:
    output: true
    permalink: /sql/:path/
  de:
    output: true
    permalink: /data-engineering/:path/
  ai:
    output: true
    permalink: /ai-engineering/:path/
  ml:
    output: true
    permalink: /ml/:path/
  infra:
    output: true
    permalink: /infrastructure/:path/
defaults:
  - scope:
      path: ''
      type: sql
    values:
      layout: lesson
      subject: sql
  - scope:
      path: ''
      type: de
    values:
      layout: lesson
      subject: data-engineering
  - scope:
      path: ''
      type: ai
    values:
      layout: lesson
      subject: ai-engineering
  - scope:
      path: ''
      type: ml
    values:
      layout: lesson
      subject: ml
  - scope:
      path: ''
      type: infra
    values:
      layout: lesson
      subject: infrastructure
exclude:
  - templates
